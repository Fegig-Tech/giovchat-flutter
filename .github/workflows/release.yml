name: Release

on:
  push:
    tags: ['v*']

# Publishing needs the `pub.dev` environment and an OIDC token (pub.dev automated publishing,
# configured on the package's Admin tab: repository Fegig-Tech/giovchat-flutter, tag pattern
# v{{version}}, environment pub.dev). The GitHub release needs write access to contents.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        id: version
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*$/\1/p' pubspec.yaml | head -n 1)
          SDK_VERSION=$(sed -n "s/^const giovSdkVersion = '\([^']*\)';.*$/\1/p" lib/src/core/client.dart | head -n 1)
          echo "pubspec version: $VERSION, giovSdkVersion: $SDK_VERSION, tag: $GITHUB_REF_NAME"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from pubspec.yaml"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION (expected v$VERSION)"; exit 1
          fi
          if [ "$SDK_VERSION" != "$VERSION" ]; then
            echo "::error::giovSdkVersion ($SDK_VERSION) in lib/src/core/client.dart does not match pubspec version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Outside the checkout, so the notes never end up in the published archive.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with content"; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      # setup-dart configures the pub.dev OIDC token for this job; the Flutter SDK's pub uses it.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 0.1.0 is published by hand (automated publishing needs an existing package), and a re-run
      # must not fail on a version that is already out: skip versions pub.dev already has.
      - name: Check whether pub.dev already has this version
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/giovchat/versions/$VERSION")
          case "$STATUS" in
            200) echo "::notice::giovchat $VERSION is already on pub.dev; skipping the publish"; echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP $STATUS from pub.dev"; exit 1 ;;
          esac

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: flutter pub publish --force

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::The GitHub release $GITHUB_REF_NAME already exists; skipping"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
