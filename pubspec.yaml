name: giovchat
description: >-
  Giov live chat for Flutter apps: a ready-made chat screen and a controller for the Giov visitor
  protocol, with realtime replies, an offline outbox, attachments and push.
version: 0.1.0
homepage: https://giovchat.app
repository: https://github.com/Fegig-Tech/giovchat-flutter
issue_tracker: https://github.com/Fegig-Tech/giovchat-flutter/issues
documentation: https://giovchat.app/docs
topics:
  - chat
  - live-chat
  - customer-support
  - messaging
  - support

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.1.0 <2.0.0"
  http_parser: ^4.0.2
  url_launcher: ">=6.2.0 <7.0.0"
  web_socket_channel: ">=2.4.0 <4.0.0"

dev_dependencies:
  fake_async: ">=1.3.0 <2.0.0"
  flutter_lints: ">=3.0.0 <5.0.0"
  flutter_test:
    sdk: flutter
